<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #f0f0f0;
      color: #333;
    }
    .container {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      margin-bottom: 1rem;
      color: #0a4f6d;
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 1rem;
      background-color: #0a4f6d;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a:hover {
      background-color: #ffc600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¿Necesitas contactarnos?</h1>
    <p>Haz clic en el botón de abajo para enviar un correo electrónico.</p>
    <a href="mailto:sp.firmalegal@gmail.com">Contactar a Corporativo legal sp torres y asociados</a>
  </div>
</body>
</html>
